# Render Blueprint untuk demo portfolio (SQLite di-seed saat build, reset tiap deploy/restart)
services:
  - type: web
    name: inventory-demo
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: gunicorn Inventory_Project.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.19
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
